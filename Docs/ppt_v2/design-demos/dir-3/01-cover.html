<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px; height: 1080px; overflow: hidden;
    background: #EFECE6; color: #141413;
    font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
    font-synthesis: none; line-break: strict;
    padding: 54px 72px;
  }
  .layout {
    display: grid; grid-template-columns: 460px 1fr; gap: 60px;
    width: 1776px; height: 972px;
    border-top: 2px solid #141413; border-bottom: 2px solid #141413;
    padding: 40px 0;
  }
  .spine-col {
    border-right: 1.5px solid #141413;
    padding-right: 48px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .top-seal {
    font-size: 18px; color: #4E4C47; letter-spacing: 0.14em; line-height: 1.6;
  }
  .top-seal .red { color: #C83E2B; font-weight: 700; }
  .vertical-title-wrap {
    display: flex; align-items: flex-start; gap: 28px; margin: auto 0;
  }
  .v-title {
    writing-mode: vertical-rl;
    font-family: "SimSun", "Georgia", serif;
    font-size: 124px; font-weight: 900; line-height: 1.08;
    letter-spacing: 0.12em; color: #141413;
  }
  .v-en {
    writing-mode: vertical-rl;
    font-family: "Bahnschrift", "Consolas", sans-serif;
    font-size: 20px; font-weight: 700; letter-spacing: 0.28em;
    color: #C83E2B;
    border-left: 2px solid #C83E2B; padding-left: 14px;
    height: 490px;
  }
  .school-stamp {
    font-size: 19px; line-height: 1.65; color: #141413;
  }
  .school-stamp .sub { font-size: 17px; color: #4E4C47; }

  .visual-col {
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .frame-box {
    position: relative; width: 100%; height: 696px;
    border: 1.5px solid #141413; overflow: hidden; background: #141413;
  }
  .frame-box img {
    width: 100%; height: 100%; object-fit: cover; object-position: center 42%;
    display: block;
  }
  .lead-note {
    font-size: 25px; line-height: 1.55; color: #141413;
    padding: 18px 0; border-bottom: 1px solid rgba(20,20,19,0.22);
  }
  .lead-note strong { color: #C83E2B; }
  .crew-row {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 36px;
    padding-top: 16px;
  }
  .crew .role { font-size: 16px; color: #1F4B6E; font-weight: 700; letter-spacing: 0.08em; margin-bottom: 4px; }
  .crew .name { font-size: 28px; font-weight: 800; color: #141413; }
</style>
</head>
<body>
<div class="layout">
  <div class="spine-col">
    <div class="top-seal">
      <div class="red">实训结题答辩 · 二〇二六年十一月</div>
      <div>UNITY 2022.3 · URP · PHOTON PUN 2</div>
    </div>

    <div class="vertical-title-wrap">
      <div class="v-title">共鸣之境</div>
      <div class="v-en">THE REALM OF RESONANCE</div>
    </div>

    <div class="school-stamp">
      <div><strong>福建师范大学协和学院</strong></div>
      <div class="sub">信息技术系 · 数字媒体技术专业</div>
      <div class="sub" style="margin-top:6px;">指导教师：黄取治</div>
    </div>
  </div>

  <div class="visual-col">
    <div class="frame-box">
      <img src="../../assets/fps_gun.png" alt="URP 双相机持枪实机画面">
    </div>

    <div class="lead-note">
      全局共鸣值 <strong>rr.resonance</strong> 驱动的动态战场联机 FPS：从常态架枪对抗到越过阈值 <strong>150</strong> 的五维环境剧变。
    </div>

    <div class="crew-row">
      <div class="crew">
        <div class="role">程序框架设计</div>
        <div class="name">吴凯东</div>
      </div>
      <div class="crew">
        <div class="role">业务逻辑实现</div>
        <div class="name">杨世杰</div>
      </div>
      <div class="crew">
        <div class="role">美术 · 策划 · 测试</div>
        <div class="name">周欣琦</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
